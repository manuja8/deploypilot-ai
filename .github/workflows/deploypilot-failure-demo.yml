name: DeployPilot AI Failure Type Demo

on:
  workflow_dispatch:
    inputs:
      failure_scenario:
        description: "Controlled CI/CD failure scenario"
        required: true
        default: "build_failure"
        type: choice
        options:
          - build_failure
          - configuration_error
          - dependency_error
          - deployment_failure
          - network_error
          - permission_error
          - resource_exhaustion
          - security_scan_failure
          - test_failure
          - timeout

permissions:
  contents: read

jobs:
  deploypilot-failure-demo:
    name: DeployPilot AI Failure Diagnosis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run controlled CI failure
        id: failure
        shell: bash
        env:
          FAILURE_SCENARIO: ${{ inputs.failure_scenario }}
        run: |
          START_TIME=$(date +%s)

          set +e
          python demo_app/failure_scenarios.py "$FAILURE_SCENARIO" > demo-failure.log 2>&1
          FAILURE_EXIT_CODE=$?
          set -e

          END_TIME=$(date +%s)
          FAILURE_DURATION=$((END_TIME - START_TIME))

          echo "exit_code=$FAILURE_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "duration=$FAILURE_DURATION" >> "$GITHUB_OUTPUT"

          echo "Controlled scenario: $FAILURE_SCENARIO"
          echo "Scenario exit code: $FAILURE_EXIT_CODE"
          echo "--- Captured CI failure log ---"
          cat demo-failure.log

          if [ "$FAILURE_EXIT_CODE" -eq 0 ]; then
            echo "The selected failure scenario unexpectedly succeeded."
            exit 1
          fi

      - name: Collect runner metrics
        id: runner
        shell: bash
        run: |
          CPU_USAGE=$(python - <<'PY'
          import os

          load = os.getloadavg()[0]
          cpus = os.cpu_count() or 1
          usage = min(100, (load / cpus) * 100)

          print(round(usage, 2))
          PY
          )

          MEMORY_USAGE=$(python - <<'PY'
          values = {}

          with open("/proc/meminfo", "r") as file:
              for line in file:
                  key, value = line.split(":", 1)
                  values[key] = int(value.strip().split()[0])

          total = values["MemTotal"]
          available = values["MemAvailable"]
          used_mb = (total - available) / 1024

          print(round(used_mb, 2))
          PY
          )

          echo "cpu_usage=$CPU_USAGE" >> "$GITHUB_OUTPUT"
          echo "memory_usage=$MEMORY_USAGE" >> "$GITHUB_OUTPUT"

          echo "CPU usage: $CPU_USAGE%"
          echo "Memory usage: $MEMORY_USAGE MB"

      - name: Create DeployPilot diagnostic request
        shell: bash
        env:
          PIPELINE_ID: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          FAILURE_SCENARIO: ${{ inputs.failure_scenario }}
          CPU_USAGE: ${{ steps.runner.outputs.cpu_usage }}
          MEMORY_USAGE: ${{ steps.runner.outputs.memory_usage }}
          FAILURE_DURATION: ${{ steps.failure.outputs.duration }}
        run: |
          python - <<'PY'
          import json
          import os

          with open("demo-failure.log", "r", errors="ignore") as file:
              error_log = file.read()[-5000:]

          payload = {
              "pipeline_id": os.environ["PIPELINE_ID"],
              "run_id": os.environ["RUN_ID"],
              "ci_tool": "GitHub Actions",
              "repository": os.environ["REPOSITORY"],
              "branch": os.environ["BRANCH"],

              "commit_size": 69,
              "files_changed": 3,
              "warnings": 2,
              "tests_failed": 0,
              "previous_failure_rate": 0.781,

              "build_duration_sec": 1850,
              "test_duration_sec": 708,
              "deploy_duration_sec": 1187,

              "cpu_usage_pct": float(os.environ.get("CPU_USAGE", "0")),
              "memory_usage_mb": 18604,
              "retry_count": 5,

              "language": "Python",
              "os": "ubuntu-latest",
              "cloud_provider": "GitHub Hosted",

              "error_log": error_log,
              "quality_gate_enabled": True,
              "actual_result": "FAIL"
          }

          with open("deploypilot-request.json", "w") as file:
              json.dump(payload, file)

          print("Controlled scenario:", os.environ["FAILURE_SCENARIO"])
          print("Actual scenario result: FAIL")
          print("DeployPilot diagnostic request created.")
          print("No prediction, risk score, risk level, failure type, or gate action is hardcoded.")
          PY

      - name: Call DeployPilot AI
        shell: bash
        env:
          DEPLOYPILOT_API_KEY: ${{ secrets.DEPLOYPILOT_API_KEY }}
          DEPLOYPILOT_API_URL: https://deploypilot-ai-api-korea-2026.azurewebsites.net
        run: |
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output deploypilot-response.json \
            --write-out "%{http_code}" \
            --request POST \
            "$DEPLOYPILOT_API_URL/github/predict" \
            --header "Content-Type: application/json" \
            --header "X-API-Key: $DEPLOYPILOT_API_KEY" \
            --data @deploypilot-request.json)

          echo "DeployPilot API HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "DeployPilot API request failed."
            cat deploypilot-response.json
            exit 1
          fi

          echo "DeployPilot prediction received:"
          jq . deploypilot-response.json

      - name: Apply DeployPilot quality gate
        shell: bash
        env:
          FAILURE_SCENARIO: ${{ inputs.failure_scenario }}
        run: |
          ACTION=$(jq -r '.quality_gate_action' deploypilot-response.json)
          RISK_LEVEL=$(jq -r '.risk_level' deploypilot-response.json)
          RISK_SCORE=$(jq -r '.risk_score' deploypilot-response.json)
          PREDICTION=$(jq -r '.prediction' deploypilot-response.json)
          FAILURE_TYPE=$(jq -r '.failure_type // "None"' deploypilot-response.json)

          echo "Controlled scenario: $FAILURE_SCENARIO"
          echo "Prediction: $PREDICTION"
          echo "Risk score: $RISK_SCORE"
          echo "Risk level: $RISK_LEVEL"
          echo "Failure type: $FAILURE_TYPE"
          echo "Quality gate action: $ACTION"

          {
            echo "## DeployPilot AI Failure Demo"
            echo ""
            echo "| Result | Value |"
            echo "|---|---|"
            echo "| Controlled Scenario | $FAILURE_SCENARIO |"
            echo "| Actual Result | FAIL |"
            echo "| Model 1 Prediction | $PREDICTION |"
            echo "| Risk Score | $RISK_SCORE |"
            echo "| Risk Level | $RISK_LEVEL |"
            echo "| Model 2 Failure Type | $FAILURE_TYPE |"
            echo "| Quality Gate | $ACTION |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ACTION" = "BLOCK" ]; then
            echo "::error::DeployPilot AI blocked this controlled failure pipeline."
            exit 1
          fi

          if [ "$ACTION" = "WARN" ]; then
            echo "::warning::DeployPilot AI detected pipeline risk."
          fi

          if [ "$ACTION" = "ALLOW" ]; then
            echo "DeployPilot AI allowed the pipeline to continue."
          fi
